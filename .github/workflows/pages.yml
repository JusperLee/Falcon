# Publishes project_page/ to GitHub Pages (https://cslikai.cn/Falcon/).
# Demo audio and video are served from https://oss.cslikai.cn/demos/, not from this repository.
name: Project page

on:
  push:
    branches: [main]
    paths: ["project_page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The page goes live only once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project_page
      - id: deployment
        uses: actions/deploy-pages@v4
